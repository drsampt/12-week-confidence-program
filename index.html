<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>12-Week Confidence Program — 5 Min/Day</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #e0c070;
    --black: #080808;
    --surface: #121212;
    --card: #1a1a1a;
    --border: #252525;
    --text: #e2e2e2;
    --muted: #777;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 60px;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    padding: 52px 24px 40px;
    text-align: center;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .hero::after {
    content: '';
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    width: 280px; height: 180px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-handle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease 0s forwards;
  }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 0.04em;
    line-height: 0.95;
    color: var(--white);
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.08s forwards;
  }

  .hero-title span { color: var(--gold); }

  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
    max-width: 320px;
    margin: 0 auto 24px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.14s forwards;
  }

  .hero-badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.2s forwards;
  }

  .hero-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--black);
    background: var(--gold);
    padding: 5px 12px;
    border-radius: 2px;
  }

  .hero-badge-outline {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 5px 12px;
    border-radius: 2px;
    opacity: 0.7;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar-wrap {
    margin: 24px 24px 0;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.25s forwards;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .progress-count {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ─── SECTION ─── */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 0 24px;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.3s forwards;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: var(--white);
    padding: 0 24px;
    margin-bottom: 4px;
    line-height: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.35s forwards;
  }

  .section-desc {
    font-size: 13px;
    color: var(--muted);
    padding: 0 24px;
    margin-bottom: 20px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.4s forwards;
  }

  /* Full CSS and body content omitted for brevity */
</style>
</head>
<body>
  <!-- BODY CONTENT OMITTED -->
</body>
</html>
